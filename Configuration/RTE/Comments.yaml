imports:
    - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Processing.yaml' }
    - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml' }
    - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml' }

editor:
  config:
    # Jira-style compact composer (#CP comment modal redesign) - the inherited Base.yaml
    # default of 300 dwarfs a one- or two-line comment; grows via Comments.css instead.
    height: 100

    # Backend styles instead of the frontend preview of contents.css, see CommentEditorContent.css.
    contentsCss:
      - 'EXT:xima_typo3_content_planner/Resources/Public/Css/CommentEditorContent.css'

    # docs/design/rules.md, "Comments": bold, italic, link, to-do list. Mentions are typed with @.
    toolbar:
      items:
        - bold
        - italic
        - link
        - '|'
        - todoList

    importModules:
      - { module: '@ckeditor/ckeditor5-list', exports: [ 'TodoList' ] }
      # @-mentions (#305). The plugin brings its own suggestion feed and its own up/downcast
      # converters, so the record context it needs is injected by
      # CommentEditorConfigurationFactory rather than configured here.
      - { module: '@content-planner/comment-mention.js', exports: [ 'ContentPlannerMention' ] }
