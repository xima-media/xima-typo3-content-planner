name: Tests
on:
  push:
    branches: [main, 'renovate/**']
  pull_request: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    uses: konradmichalik/reusable-github-actions/.github/workflows/tests-typo3.yml@5eedac064fa3e42f2beadd759ec2d0a837b6a22a # feat/typo3-dbms-and-sca-versions
    with:
      php-versions: '["8.2", "8.5"]'
      typo3-versions: '["13.4", "14.3"]'
      dependencies: '["highest", "lowest"]'
      databases: '["mysql:8.4", "mariadb:11.4"]'
      databases-php-version: '8.5'
