name: Tests
on:
  push:
    branches: [main, 'renovate/**']
  pull_request: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    uses: konradmichalik/reusable-github-actions/.github/workflows/tests-typo3.yml@4243a59d724ff48526f9a6e4e8e7a1c23200e8cd # main, untagged (0.2.0 pending)
    with:
      php-versions: '["8.2", "8.5"]'
      typo3-versions: '["13.4", "14.3"]'
      dependencies: '["highest", "lowest"]'
      databases: '["mysql:8.4", "mariadb:11.4"]'
      databases-php-version: '8.5'
