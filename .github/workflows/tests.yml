name: Tests
on:
  push:
    branches: [main, 'renovate/**']
  pull_request: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: konradmichalik/reusable-github-actions/.github/workflows/tests-typo3.yml@a8d99ad1b62b39346634f8d3bfd99795cc5ab03d # feat/typo3-dbms-and-sca-versions
    with:
      php-versions: '["8.2", "8.5"]'
      typo3-versions: '["13.4", "14.3"]'
      dependencies: '["highest", "lowest"]'
      databases: '["mysql:8.4", "mariadb:11.4"]'
      databases-php-version: '8.5'
