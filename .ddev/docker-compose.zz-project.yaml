# Repo-owned overrides for docker-compose.typo3-setup.yaml. Unlike that file,
# this one isn't managed by the add-on, so it survives `ddev add-on get`
# upgrades. DDEV merges every docker-compose.*.yaml file under .ddev/ in
# filename order, and Compose merges the "environment" list by variable name.
# The "zz" prefix keeps this file sorting after docker-compose.typo3-setup.yaml,
# so its values win for any variable both files set.
#
# Run `ddev restart` after changing it.
services:
    web:
        environment:
            # Permanently scope down the installed TYPO3 versions, surviving
            # every future `ddev add-on get` update.
            - TYPO3_VERSIONS=13 14
