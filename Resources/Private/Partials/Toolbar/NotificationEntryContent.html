<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<span class="content-planner-notification-entry__dot" aria-hidden="true"></span>
<span class="content-planner-notification-entry__icon" aria-hidden="true">
    <core:icon identifier="{item.iconIdentifier}" size="small" alternativeMarkupIdentifier="inline"/>
</span>
<span class="content-planner-notification-entry__body">
    <span class="content-planner-notification-entry__sentence">
        <f:if condition="{item.read}"><f:else><span class="visually-hidden">{f:translate(key: 'notification.dropdown.unread', extensionName: 'xima_typo3_content_planner')}: </span></f:else></f:if>
        <f:if condition="{item.eventType} != 'content_changed'"><strong>{item.actorLabel}</strong></f:if>
        {item.verbBefore}
        <strong>{item.title}</strong>
        {item.verbAfter}
    </span>
    <span class="content-planner-notification-entry__meta">
        {item.timeAgo}<f:if condition="{item.pagePath}"> &middot; {item.pagePath}</f:if><f:if condition="{item.changeSummary}"> &middot; {item.changeSummary}</f:if>
    </span>
    <f:if condition="{item.tagLabel}">
        <span class="content-planner-notification-entry__tag{f:if(condition: item.tagHighlighted, then: ' content-planner-notification-entry__tag--highlight')}">{item.tagLabel}</span>
    </f:if>
</span>
</html>
