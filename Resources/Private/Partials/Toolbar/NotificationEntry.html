<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<li class="content-planner-notification-entry{f:if(condition: item.read, then: ' content-planner-notification-entry--read')}"
    data-notification-uid="{item.uid}">
    <f:if condition="{item.url}">
        <f:then>
            <a href="{item.url}" class="dropdown-item content-planner-notification-entry__link" role="menuitem">
                <f:render partial="Toolbar/NotificationEntryContent" arguments="{item: item}"/>
            </a>
        </f:then>
        <f:else>
            <span class="dropdown-item content-planner-notification-entry__link content-planner-notification-entry__link--disabled">
                <f:render partial="Toolbar/NotificationEntryContent" arguments="{item: item}"/>
            </span>
        </f:else>
    </f:if>
    <f:if condition="{item.read}">
        <f:else>
            <button type="button"
                    class="content-planner-notification-entry__mark-read"
                    data-notification-mark-read="{item.uid}"
                    aria-label="{f:translate(key: 'notification.dropdown.markRead', extensionName: 'xima_typo3_content_planner')}"
                    title="{f:translate(key: 'notification.dropdown.markRead', extensionName: 'xima_typo3_content_planner')}">
                <core:icon identifier="actions-check" size="small"/>
            </button>
        </f:else>
    </f:if>
</li>
</html>
