<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:xcp="http://typo3.org/ns/Xima/XimaTypo3ContentPlanner/ViewHelpers"
    data-namespace-typo3-fluid="true">


<f:variable name="relax">EXT:xima_typo3_content_planner/Resources/Public/Icons/icon-relax-{xcp:randomNumber(min: 1,max: 5)}.svg</f:variable>
<div class="content-planner-widget__empty-icon" style="background-image:url({f:uri.resource(path:relax)});"></div>

<style>
    html[data-color-scheme="dark"] .content-planner-widget__empty-icon {
        filter: invert(100%);
        -webkit-filter: invert(100%);
    }

    /* PageRenderer only writes data-color-scheme when the user picked light or dark
       explicitly - on "auto", which is the default, the attribute is left off entirely. So the
       OS preference has to be matched on the *absence* of an explicit light choice, not on
       data-color-scheme="auto", which is never rendered. */
    @media (prefers-color-scheme: dark) {
        html:not([data-color-scheme="light"]) .content-planner-widget__empty-icon {
            filter: invert(100%);
            -webkit-filter: invert(100%);
        }
    }
</style>
