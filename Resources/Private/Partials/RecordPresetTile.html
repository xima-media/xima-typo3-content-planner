<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">

<a href="{preset.link}" class="content-planner-module__preset{f:if(condition: preset.active, then: ' content-planner-module__preset--active')}">
    <core:icon identifier="{icon}" size="small" alternativeMarkupIdentifier="inline"/>
    <span class="content-planner-module__preset-figure" aria-hidden="true">{preset.countLabel}</span>
    <span class="visually-hidden"><f:translate key="{labelKey}" extensionName="XimaTypo3ContentPlanner" arguments="{0: preset.countLabel}"/></span>
</a>
</html>
