<html
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<!-- Status badge (docs/design/rules.md): the icon carries the meaning once colours repeat, the name stays text. -->
<span class="content-planner-status-badge content-planner-status content-planner-status--{color}">
    <core:icon identifier="{icon}" size="small" alternativeMarkupIdentifier="inline"/>
    <span class="content-planner-status-badge__name">{title}</span>
</span>
</html>
