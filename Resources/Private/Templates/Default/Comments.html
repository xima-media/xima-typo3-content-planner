<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true">

<div id="content-planner-comment-list" class="content-planner-comment-list" data-replies-expanded="{f:if(condition: '{repliesExpanded}', then: '1', else: '0')}">
    <div class="content-planner-comments__main">
        <div class="content-planner-comments__bar">
            <button type="button" class="btn btn-default btn-sm" data-comment-filter-toggle aria-expanded="false" aria-controls="content-planner-comment-filter-panel">
                <core:icon identifier="content-planner-filter" size="small" alternativeMarkupIdentifier="inline"/>
                <f:translate key="comment.filter.toggle" extensionName="XimaTypo3ContentPlanner"/>
                <f:if condition="{filter.show} != 'open'">
                    <span class="content-planner-comment-filter-toggle__badge" title="{f:translate(key: 'comment.filter.active', extensionName: 'XimaTypo3ContentPlanner')}">1</span>
                </f:if>
            </button>
        </div>
        <f:if condition="{comments -> f:count()}">
            <f:then>
                <f:if condition="{older.olderCount} && {older.olderFirst}"><f:render partial="CommentsOlder" arguments="{older: older}"/></f:if>
                <f:for each="{comments}" as="record">
                    <f:render partial="Comment" arguments="{comment: record, id: id, table: table, isReply: 0, showRecordInfo: record.foreignRecord, repliesExpanded: repliesExpanded, currentUserUid: currentUserUid}" />
                </f:for>
                <f:if condition="{older.olderCount} && !{older.olderFirst}"><f:render partial="CommentsOlder" arguments="{older: older}"/></f:if>
                <f:if condition="{childComments.hasMore}">
                    <div class="content-planner-widget__more-results" role="status" aria-live="polite">
                        <f:translate key="comment.childComments.moreResults" extensionName="XimaTypo3ContentPlanner"/>
                    </div>
                </f:if>
            </f:then>
            <f:else>
                <div class="content-planner-widget__empty content-planner-comment-empty">
                    <f:render partial="Empty"/>
                    <div class="text-center content-planner-comment-empty__text">
                        <f:format.raw>
                            <f:translate key="comment.empty" extensionName="XimaTypo3ContentPlanner"
                                        arguments="{0: '{newCommentUri}', 1: '{table}', 2: '{id}'}"/>
                        </f:format.raw>
                    </div>
                </div>
            </f:else>
        </f:if>

        <f:if condition="{filter.resolvedCount} && ({filter.show} == 'open' || {filter.show} == 'todo')">
            <div class="content-planner-comments__resolved-hidden">
                <core:icon identifier="content-planner-circle-check" size="small" alternativeMarkupIdentifier="inline"/>
                <span><f:translate key="comment.resolvedHidden" extensionName="XimaTypo3ContentPlanner" arguments="{0: filter.resolvedCount}"/></span>
                <button type="button" class="btn btn-link" data-comment-show-resolved>
                    <f:translate key="comment.resolvedHidden.show" extensionName="XimaTypo3ContentPlanner"/>
                </button>
            </div>
        </f:if>

        <f:if condition="{commentComposerHtml}">
            <div class="content-planner-comment-composer-wrapper" data-comment-composer-wrapper>
                <div class="content-planner-comment-composer-row">
                    <span class="content-planner-comment-composer-row__avatar">
                        <be:avatar backendUser="{currentUserUid}" size="32" showIcon="true"/>
                    </span>
                    <div class="content-planner-comment-composer-row__body">
                        <div class="content-planner-comment-composer-collapsed" data-comment-composer-collapsed>
                            <button type="button" class="content-planner-comment-composer-trigger" data-comment-composer-trigger>
                                <span class="content-planner-comment-composer-trigger__placeholder">
                                    <f:translate key="comment.composer.placeholder" extensionName="XimaTypo3ContentPlanner"/>
                                </span>
                            </button>
                            <p class="content-planner-comment-composer-hint">
                                <f:format.raw><f:translate key="comment.composer.hint.shortcut" extensionName="XimaTypo3ContentPlanner"/></f:format.raw>
                            </p>
                        </div>
                        <form class="content-planner-comment-composer content-planner-comment-composer--new"
                            hidden
                            data-comment-composer
                            data-mode="new"
                            data-table="{table}"
                            data-id="{id}"
                            data-parent-uid="0"
                            data-composer-comment-uid="0"
                            data-status-uid="{commentFirst.defaultStatus.uid}">
                            <f:if condition="{commentFirst.mode} == 'picker'">
                                <div class="content-planner-comment-composer__status-picker">
                                    <label for="content-planner-comment-status-picker">
                                        <f:translate key="comment.commentFirst.picker.label" extensionName="XimaTypo3ContentPlanner"/>
                                    </label>
                                    <select id="content-planner-comment-status-picker" name="statusUid"
                                            class="form-select form-select-sm" data-comment-status-picker required>
                                        <option value="" selected disabled>
                                            <f:translate key="comment.commentFirst.picker.placeholder" extensionName="XimaTypo3ContentPlanner"/>
                                        </option>
                                        <f:for each="{commentFirst.statuses}" as="statusOption">
                                            <option value="{statusOption.uid}">{statusOption.title}</option>
                                        </f:for>
                                    </select>
                                </div>
                            </f:if>
                            <f:if condition="{statusChange}">
                                <div class="content-planner-comment-composer__status-picker">
                                    <label for="content-planner-comment-status-change">
                                        <f:translate key="comment.composer.status.label" extensionName="XimaTypo3ContentPlanner"/>
                                    </label>
                                    <select id="content-planner-comment-status-change" name="statusUid"
                                            class="form-select form-select-sm" data-comment-status-picker>
                                        <option value="" selected><f:translate key="comment.composer.status.keep" extensionName="XimaTypo3ContentPlanner"/></option>
                                        <f:for each="{statusChange}" as="statusOption">
                                            <option value="{statusOption.uid}">{statusOption.title}</option>
                                        </f:for>
                                    </select>
                                </div>
                            </f:if>
                            <div class="content-planner-comment-composer__editor">
                                <f:format.raw>{commentComposerHtml}</f:format.raw>
                            </div>
                            <div class="content-planner-comment-composer__footer">
                                <div class="content-planner-comment-composer__actions">
                                    <button type="submit" class="btn btn-primary btn-sm" data-comment-composer-submit>
                                        <core:icon identifier="content-planner-send" size="small" alternativeMarkupIdentifier="inline"/>
                                        <f:if condition="{commentFirst.mode} == 'oneClick'">
                                            <f:then>
                                                <f:translate key="comment.commentFirst.oneClick.submit" extensionName="XimaTypo3ContentPlanner"
                                                            arguments="{0: '{commentFirst.defaultStatus.title}'}"/>
                                            </f:then>
                                            <f:else>
                                                <f:translate key="comment.actions.submit" extensionName="XimaTypo3ContentPlanner"/>
                                            </f:else>
                                        </f:if>
                                    </button>
                                    <button type="button" class="btn btn-default btn-sm" data-comment-composer-cancel>
                                        <core:icon identifier="content-planner-x" size="small" alternativeMarkupIdentifier="inline"/>
                                        <f:translate key="comment.actions.cancel" extensionName="XimaTypo3ContentPlanner"/>
                                    </button>
                                </div>
                                <p class="content-planner-comment-composer-hint">
                                    <f:format.raw><f:translate key="comment.composer.hint.submit" extensionName="XimaTypo3ContentPlanner"/></f:format.raw>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </f:if>
    </div>
        <aside id="content-planner-comment-filter-panel" class="content-planner-comments__aside" hidden aria-label="{f:translate(key: 'comment.filter.headline', extensionName: 'XimaTypo3ContentPlanner')}">
            <form id="content-planner-comment-filter" class="content-planner-comment-filter" data-table="{table}" data-id="{id}">
                <f:if condition="{filter.loadAll}"><input type="hidden" name="all" value="1"></f:if>
                <fieldset class="content-planner-comment-filter__group">
                    <legend><f:translate key="comment.filter.show" extensionName="XimaTypo3ContentPlanner"/></legend>
                    <f:for each="{0: {value: 'open', label: 'comment.filter.show.open', count: filter.openCount}, 1: {value: 'todo', label: 'comment.filter.show.todo', count: filter.todoCount}, 2: {value: 'resolved', label: 'comment.filter.show.resolved', count: filter.resolvedCount}, 3: {value: 'all', label: 'comment.filter.show.all', count: filter.allCount}}" as="option">
                        <label class="content-planner-comment-filter__choice">
                            <input type="radio" name="show" value="{option.value}"{f:if(condition: '{option.value} == {filter.show}', then: ' checked')}>
                            <span><f:translate key="{option.label}" extensionName="XimaTypo3ContentPlanner"/></span>
                            <span class="content-planner-comment-filter-count">{option.count}</span>
                        </label>
                    </f:for>
                </fieldset>
                <f:if condition="{childComments.count}">
                    <label class="content-planner-comment-filter__choice">
                        <input type="checkbox" data-toggle-include-child-comments{f:if(condition: filter.includeChildComments, then: ' checked')}>
                        <span><f:translate key="comment.filter.includeChildComments" extensionName="XimaTypo3ContentPlanner"/></span>
                        <span class="content-planner-comment-filter-count">{childComments.count}</span>
                    </label>
                </f:if>
                <div class="content-planner-comment-filter__group">
                    <label for="content-planner-comment-filter-sort" class="content-planner-comment-filter__label"><f:translate key="comment.filter.sort" extensionName="XimaTypo3ContentPlanner"/></label>
                    <select id="content-planner-comment-filter-sort" name="sortComments" class="form-select form-select-sm">
                        <f:for each="{0: {value: 'DESC', label: 'comment.filter.sort.newest'}, 1: {value: 'ASC', label: 'comment.filter.sort.oldest'}}" as="option">
                            <option value="{option.value}"{f:if(condition: '{option.value} == {filter.sortComments}', then: ' selected')}><f:translate key="{option.label}" extensionName="XimaTypo3ContentPlanner"/></option>
                        </f:for>
                    </select>
                </div>
                <div class="content-planner-comment-filter__actions">
                    <f:if condition="{shareUrl}">
                        <a class="btn btn-default btn-sm" role="button" data-share-modal-uri="{shareUrl}">
                            <core:icon identifier="content-planner-link" size="small" alternativeMarkupIdentifier="inline"/>
                            <f:translate key="comment.actions.share" extensionName="XimaTypo3ContentPlanner"/>
                        </a>
                    </f:if>
                    <f:if condition="{repliesExpanded}">
                        <f:then>
                            <button type="button" class="btn btn-default btn-sm" data-toggle-replies-expanded="0">
                                <core:icon identifier="content-planner-chevron-up" size="small" alternativeMarkupIdentifier="inline"/>
                                <f:translate key="comment.actions.replies.collapse" extensionName="XimaTypo3ContentPlanner"/>
                            </button>
                        </f:then>
                        <f:else>
                            <button type="button" class="btn btn-default btn-sm" data-toggle-replies-expanded="1">
                                <core:icon identifier="content-planner-chevron-down" size="small" alternativeMarkupIdentifier="inline"/>
                                <f:translate key="comment.actions.replies.expand" extensionName="XimaTypo3ContentPlanner"/>
                            </button>
                        </f:else>
                    </f:if>
                </div>
            </form>
        </aside>
</div>
