<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">

<div id="content-planner-comment-list" class="content-planner-comment-list" data-replies-expanded="{f:if(condition: '{repliesExpanded}', then: '1', else: '0')}">
    <f:if condition="{comments -> f:count()} || {filter.resolvedCount} || {filter.isPage}">
        <form id="content-planner-comment-filter" class="content-planner-comment-filter" data-table="{table}" data-id="{id}">
            <div class="form-sort">
                <label for="content-planner-comment-filter-sort">Sort</label>
                <select id="content-planner-comment-filter-sort" name="sortComments"
                        class="form-select form-select-sm">
                    <f:for each="{0: {value: 'DESC', label: 'Newest'}, 1: {value: 'ASC', label: 'Oldest'}}" as="option">
                        <option value="{option.value}" {f:if(condition:
                        '{option.value} == {filter.sortComments}', then: 'selected', else: '')}>
                        {option.label}
                        </option>
                    </f:for>
                </select>
                <f:if condition="{shareUrl}">
                    <div class="dropdown">
                        <button type="button" class="btn btn-default btn-sm dropdown-toggle dropdown-toggle-no-chevron" data-bs-toggle="dropdown"
                                aria-expanded="false"
                                aria-label="{f:translate(key: 'comment.actions.menu', extensionName: 'XimaTypo3ContentPlanner')}"
                                title="{f:translate(key: 'comment.actions.menu', extensionName: 'XimaTypo3ContentPlanner')}">
                            <core:icon identifier="actions-menu-alternative" size="small"/>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" data-share-modal-uri="{shareUrl}">
                                    <core:icon identifier="actions-link" size="small"/>
                                    <f:translate key="comment.actions.share"
                                                extensionName="XimaTypo3ContentPlanner"/>
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"/></li>
                            <li>
                                <f:if condition="{repliesExpanded}">
                                    <f:then>
                                        <button type="button" class="dropdown-item" data-toggle-replies-expanded="0">
                                            <core:icon identifier="actions-chevron-up" size="small"/>
                                            <f:translate key="comment.actions.replies.collapse"
                                                        extensionName="XimaTypo3ContentPlanner"/>
                                        </button>
                                    </f:then>
                                    <f:else>
                                        <button type="button" class="dropdown-item" data-toggle-replies-expanded="1">
                                            <core:icon identifier="actions-chevron-down" size="small"/>
                                            <f:translate key="comment.actions.replies.expand"
                                                        extensionName="XimaTypo3ContentPlanner"/>
                                        </button>
                                    </f:else>
                                </f:if>
                            </li>
                        </ul>
                    </div>
                </f:if>
            </div>
            <f:if condition="{filter.resolvedCount}">
                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" value="1"
                           id="content-planner-comment-filter-resolved"
                           name="showResolvedComments"
                           {f:if(condition: '{filter.showResolvedComments}', then: 'checked', else: '')}
                    />
                    <label for="content-planner-comment-filter-resolved">Show resolved comments <span
                            class="badge badge-secondary">{filter.resolvedCount}</span></label>
                </div>
            </f:if>
            <f:if condition="{filter.isPage}">
                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" value="1"
                           id="content-planner-comment-filter-include-child-comments"
                           name="includeChildComments"
                           {f:if(condition: '{filter.includeChildComments}', then: 'checked', else: '')}
                    />
                    <label for="content-planner-comment-filter-include-child-comments">
                        <f:translate key="comment.filter.includeChildComments" extensionName="XimaTypo3ContentPlanner"/>
                    </label>
                </div>
            </f:if>
        </form>
    </f:if>

    <f:if condition="{comments -> f:count()}">
        <f:then>
            <f:for each="{comments}" as="record">
                <f:render partial="Comment" arguments="{comment: record, id: id, table: table, isReply: 0, showRecordInfo: 0, repliesExpanded: repliesExpanded}" />
            </f:for>
        </f:then>
        <f:else>
            <div class="content-planner-widget__empty content-planner-comment-empty">
                <f:render partial="Empty"/>
                <div class="text-center content-planner-comment-empty__text">
                    <f:format.raw>
                        <f:translate key="comment.empty" extensionName="XimaTypo3ContentPlanner"
                                    arguments="{0: '{newCommentUri}', 1: '{table}', 2: '{id}'}"/>
                    </f:format.raw>
                </div>
            </div>
        </f:else>
    </f:if>

    <f:if condition="{childComments.active}">
        <div class="content-planner-comment-child-comments">
            <h4 class="content-planner-comment-child-comments__heading">
                <f:translate key="comment.childComments.heading" extensionName="XimaTypo3ContentPlanner"/>
            </h4>
            <f:for each="{childComments.groups}" as="group">
                <div class="content-planner-comment-group">
                    <div class="content-planner-comment-group__header">
                        <core:icon identifier="{group.icon}" size="small"/>
                        <a href="{group.recordLink}">{group.title}</a>
                    </div>
                    <f:for each="{group.comments}" as="record">
                        <f:render partial="Comment" arguments="{comment: record, id: id, table: table, isReply: 0, showRecordInfo: 0, repliesExpanded: repliesExpanded}" />
                    </f:for>
                </div>
            </f:for>
            <f:if condition="{childComments.hasMore}">
                <div class="content-planner-widget__more-results" role="status" aria-live="polite">
                    <f:translate key="comment.childComments.moreResults" extensionName="XimaTypo3ContentPlanner"/>
                </div>
            </f:if>
        </div>
    </f:if>

    <f:if condition="{commentComposerHtml}">
        <form class="content-planner-comment-composer content-planner-comment-composer--new"
            data-comment-composer
            data-mode="new"
            data-table="{table}"
            data-id="{id}"
            data-parent-uid="0"
            data-comment-uid="0"
            data-status-uid="{commentFirst.defaultStatus.uid}">
            <f:if condition="{commentFirst.mode} == 'picker'">
                <div class="content-planner-comment-composer__status-picker">
                    <label for="content-planner-comment-status-picker">
                        <f:translate key="comment.commentFirst.picker.label" extensionName="XimaTypo3ContentPlanner"/>
                    </label>
                    <select id="content-planner-comment-status-picker" name="statusUid"
                            class="form-select form-select-sm" data-comment-status-picker required>
                        <option value="" selected disabled>
                            <f:translate key="comment.commentFirst.picker.placeholder" extensionName="XimaTypo3ContentPlanner"/>
                        </option>
                        <f:for each="{commentFirst.statuses}" as="statusOption">
                            <option value="{statusOption.uid}">{statusOption.title}</option>
                        </f:for>
                    </select>
                </div>
            </f:if>
            <div class="content-planner-comment-composer__editor">
                <f:format.raw>{commentComposerHtml}</f:format.raw>
            </div>
            <div class="content-planner-comment-composer__actions">
                <button type="submit" class="btn btn-primary btn-sm" data-comment-composer-submit>
                    <f:if condition="{commentFirst.mode} == 'oneClick'">
                        <f:then>
                            <f:translate key="comment.commentFirst.oneClick.submit" extensionName="XimaTypo3ContentPlanner"
                                        arguments="{0: '{commentFirst.defaultStatus.title}'}"/>
                        </f:then>
                        <f:else>
                            <f:translate key="comment.actions.submit" extensionName="XimaTypo3ContentPlanner"/>
                        </f:else>
                    </f:if>
                </button>
            </div>
        </form>
    </f:if>
</div>
