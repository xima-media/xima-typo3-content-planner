<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true">

<div class="widget-content-main content-planner-widget {f:if(condition: filter, then: 'content-planner-widget--has-filter')} {f:if(condition: '{mode} == \'assignee\'', then: 'content-planner-widget--assigned')} {f:if(condition: '{mode} == \'todo\'', then: 'content-planner-widget--todo')}">
    <input type="hidden" name="currentBackendUser" value="{currentBackendUser}"/>
    <input type="hidden" name="todo" value="{todo}"/>

    <f:if condition="{mode} == 'todo'">
        <div class="content-planner-widget__description">
            <f:if condition="{todoInfo.total} > 0">
                <f:then>
                    <a href="{todoInfo.link}" class="content-planner-kpi-tile">
                        <core:icon identifier="content-planner-checkbox" size="large"/>
                        <span class="content-planner-kpi-tile__figure" aria-hidden="true">{todoInfo.resolved}/{todoInfo.total}</span>
                        <span class="visually-hidden"><f:translate key="widgets.contentPlanner.status.todo" extensionName="XimaTypo3ContentPlanner" arguments="{0: todoInfo.resolved, 1: todoInfo.total}"/></span>
                    </a>
                </f:then>
                <f:else>
                    <div class="content-planner-kpi-tile content-planner-kpi-tile--empty">
                        <core:icon identifier="content-planner-checkbox" size="large"/>
                        <span class="content-planner-kpi-tile__figure" aria-hidden="true">0</span>
                        <span class="visually-hidden"><f:translate key="widgets.contentPlanner.status.todo.empty" extensionName="XimaTypo3ContentPlanner"/></span>
                    </div>
                </f:else>
            </f:if>
        </div>
    </f:if>

    <f:if condition="{mode} == 'assignee'">
        <div class="content-planner-widget__description">
            <f:if condition="{assigneeInfo.count} > 0">
                <f:then>
                    <a href="{assigneeInfo.link}" class="content-planner-kpi-tile">
                        <core:icon identifier="content-planner-user-circle" size="large"/>
                        <span class="content-planner-kpi-tile__figure" aria-hidden="true"><f:if condition="{assigneeInfo.hasMore}"><f:then>{assigneeInfo.count}+</f:then><f:else>{assigneeInfo.count}</f:else></f:if></span>
                        <span class="visually-hidden">
                            <f:if condition="{assigneeInfo.hasMore}">
                                <f:then><f:translate key="widgets.contentPlanner.status.assignee.atLeast" extensionName="XimaTypo3ContentPlanner" arguments="{0: assigneeInfo.count}"/></f:then>
                                <f:else><f:translate key="widgets.contentPlanner.status.assignee" extensionName="XimaTypo3ContentPlanner" arguments="{0: assigneeInfo.count}"/></f:else>
                            </f:if>
                        </span>
                    </a>
                </f:then>
                <f:else>
                    <div class="content-planner-kpi-tile content-planner-kpi-tile--empty">
                        <core:icon identifier="content-planner-user-circle" size="large"/>
                        <span class="content-planner-kpi-tile__figure" aria-hidden="true">0</span>
                        <span class="visually-hidden"><f:translate key="widgets.contentPlanner.status.assignee.empty" extensionName="XimaTypo3ContentPlanner"/></span>
                    </div>
                </f:else>
            </f:if>
        </div>
    </f:if>

    <f:if condition="{filter}">
        <f:render partial="WidgetFilter" arguments="{_all}" />
    </f:if>
    <div class="content-planner-widget__table-wrapper">
        <table class="widget-table table">
            <thead class="content-planner-hide">
            <tr>
                <th>
                    <f:translate key="widgets.contentPlanner.header.title" extensionName="XimaTypo3ContentPlanner"/>
                </th>
                <th>
                    <f:translate key="widgets.contentPlanner.header.site" extensionName="XimaTypo3ContentPlanner"/>
                </th>
                <th>
                    <f:translate key="widgets.contentPlanner.header.tstamp" extensionName="XimaTypo3ContentPlanner"/>
                </th>
                <th>
                    <f:translate key="widgets.contentPlanner.header.assignee"
                                extensionName="XimaTypo3ContentPlanner"/>
                </th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
    <div class="content-planner-widget__empty">
        <f:render partial="Empty"/>
    </div>
    <div class="content-planner-widget__more-results" role="status" aria-live="polite" hidden>
        <f:translate key="widgets.contentPlanner.moreResults" extensionName="XimaTypo3ContentPlanner"/>
    </div>
    <div class="content-planner-widget__loading content-planner-hide">
        <core:icon identifier="spinner-circle" size="large"/>
    </div>
</div>
</html>
