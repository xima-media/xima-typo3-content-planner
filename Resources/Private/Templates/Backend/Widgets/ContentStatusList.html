<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true">

<div class="widget-content-main content-planner-widget {f:if(condition: filter, then: 'content-planner-widget--has-filter')} {f:if(condition: '{mode} == \'assignee\'', then: 'content-planner-widget--assigned')} {f:if(condition: '{mode} == \'todo\'', then: 'content-planner-widget--todo')} {f:if(condition: '{mode} == \'mywork\'', then: 'content-planner-widget--mywork')}">
    <input type="hidden" name="currentBackendUser" value="{currentBackendUser}"/>
    <input type="hidden" name="todo" value="{todo}"/>

    <f:if condition="{tiles}">
        <div class="content-planner-kpi-tiles">
            <f:for each="{tiles}" as="tile">
                <f:render partial="KpiTile" arguments="{tile}"/>
            </f:for>
        </div>
    </f:if>

    <f:if condition="{filter}">
        <f:render partial="WidgetFilter" arguments="{_all}" />
    </f:if>

    <!-- The Todo/Assignee KPI tiles above already carry a server-computed count and link
         straight to the matching filtered Records module view (CP-33 follow-up annotation
         feedback) - the per-record list below them is the general, filterable Status widget's
         own content and would just duplicate that count as a single, redundant row. -->
    <f:if condition="{mode} != 'todo' && {mode} != 'assignee' && {mode} != 'mywork'">
        <div class="content-planner-widget__table-wrapper">
            <table class="widget-table table">
                <thead class="content-planner-hide">
                <tr>
                    <th>
                        <f:translate key="widgets.contentPlanner.header.title" extensionName="XimaTypo3ContentPlanner"/>
                    </th>
                    <th>
                        <f:translate key="widgets.contentPlanner.header.site" extensionName="XimaTypo3ContentPlanner"/>
                    </th>
                    <th>
                        <f:translate key="widgets.contentPlanner.header.tstamp" extensionName="XimaTypo3ContentPlanner"/>
                    </th>
                    <th>
                        <f:translate key="widgets.contentPlanner.header.assignee"
                                    extensionName="XimaTypo3ContentPlanner"/>
                    </th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
        <div class="content-planner-widget__empty">
            <f:render partial="Empty"/>
        </div>
        <div class="content-planner-widget__more-results" role="status" aria-live="polite" hidden>
            <f:translate key="widgets.contentPlanner.moreResults" extensionName="XimaTypo3ContentPlanner"/>
        </div>
        <div class="content-planner-widget__loading content-planner-hide">
            <core:icon identifier="spinner-circle" size="large"/>
        </div>
    </f:if>
</div>
</html>
