<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true">

<div class="widget-content-main content-planner-widget {f:if(condition: filter, then: 'content-planner-widget--has-filter')}">
    <f:if condition="{filter}">
        <f:render partial="WidgetFilter" arguments="{_all}" />
    </f:if>

    <div class="content-planner-widget__table-wrapper">
        <table class="widget-table table">
            <thead class="content-planner-hide">
            <tr>
                <th>
                    <f:translate key="widgets.contentPlanner.header.title" extensionName="XimaTypo3ContentPlanner"/>
                </th>
                <th>
                    <f:translate key="header.status" extensionName="XimaTypo3ContentPlanner"/>
                </th>
                <th>
                    <f:translate key="widgets.contentPlanner.header.assignee" extensionName="XimaTypo3ContentPlanner"/>
                </th>
                <th>
                    <f:translate key="widgets.contentPlanner.header.tstamp" extensionName="XimaTypo3ContentPlanner"/>
                </th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
    <div class="content-planner-widget__empty">
        <f:render partial="Empty"/>
    </div>
    <div class="content-planner-widget__more-results" role="status" aria-live="polite" hidden>
        <f:translate key="widgets.contentPlanner.moreResults" extensionName="XimaTypo3ContentPlanner"/>
    </div>
    <div class="content-planner-widget__loading content-planner-hide">
        <core:icon identifier="spinner-circle" size="large"/>
    </div>
</div>
</html>
