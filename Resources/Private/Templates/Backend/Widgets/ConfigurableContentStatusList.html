<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true">

<div class="widget-content-main content-planner-widget content-planner-widget--configurable content-planner-widget--server-rendered">

    <f:if condition="{items}">
        <f:if condition="{mode} == 'todo' && {todo}">
            <div class="content-planner-widget__description">
                <f:translate key="widgets.contentPlanner.status.todo" extensionName="XimaTypo3ContentPlanner" arguments="{0: todo.resolved, 1: todo.total}"/>
            </div>
        </f:if>

        <f:if condition="{assignedToMeCount} !== null">
            <div class="content-planner-widget__description">
                <f:translate key="widgets.contentPlanner.status.assignee" extensionName="XimaTypo3ContentPlanner" arguments="{0: assignedToMeCount}"/>
            </div>
        </f:if>
    </f:if>

    <div class="content-planner-widget__table-wrapper">
        <f:if condition="{items}">
            <f:then>
                <table class="widget-table table">
                    <thead>
                    <tr>
                        <th>
                            <f:translate key="widgets.contentPlanner.header.title" extensionName="XimaTypo3ContentPlanner"/>
                        </th>
                        <th>
                            <f:translate key="header.status" extensionName="XimaTypo3ContentPlanner"/>
                        </th>
                        <th>
                            <f:translate key="widgets.contentPlanner.header.assignee" extensionName="XimaTypo3ContentPlanner"/>
                        </th>
                        <th>
                            <f:translate key="widgets.contentPlanner.header.tstamp" extensionName="XimaTypo3ContentPlanner"/>
                        </th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <f:for each="{items}" as="item">
                        <tr>
                            <td>
                                <div class="content-planner-widget__title-line">
                                    <a href="{item.link}">
                                        <f:format.raw>{item.recordIcon}</f:format.raw>
                                        <strong>{item.title}</strong>
                                    </a>
                                    <f:if condition="{item.assignedToCurrentUser}">
                                        <span class="content-planner-tag"><f:translate key="records.tag.assignedToYou" extensionName="XimaTypo3ContentPlanner"/></span>
                                    </f:if>
                                </div>
                                <f:if condition="{item.pagePath}">
                                    <div class="content-planner-widget__path" title="{item.pagePath}">{item.pagePath}</div>
                                </f:if>
                            </td>
                            <td>
                                <f:if condition="{item.statusColor}">
                                    <f:render partial="StatusBadge" arguments="{title: item.status, icon: item.statusIconIdentifier, color: item.statusColor}"/>
                                </f:if>
                            </td>
                            <td>
                                <f:if condition="{item.assignee}">
                                    <f:then>
                                        <span title="{item.assigneeName}"><f:format.raw>{item.assigneeAvatar}</f:format.raw> {item.assigneeShortName}</span>
                                    </f:then>
                                    <f:else>
                                        <span class="content-planner-widget__muted"><f:translate key="header.unassigned" extensionName="XimaTypo3ContentPlanner"/></span>
                                    </f:else>
                                </f:if>
                            </td>
                            <td><small title="{item.updatedRaw}">{item.updated}</small></td>
                            <td>
                                <f:if condition="{item.data.tx_ximatypo3contentplanner_comments} > 0">
                                    <a href="{item.link}"
                                       class="content-planner-link--comments"
                                       data-table="{item.data.tablename}"
                                       data-id="{item.data.uid}">
                                        <f:format.raw>{item.comments}</f:format.raw>
                                    </a>
                                    <f:if condition="{item.todo}">
                                        <f:if condition="{item.todoShareUrl}">
                                            <f:then>
                                                <a href="{item.todoShareUrl}">
                                                    <f:format.raw>{item.todo}</f:format.raw>
                                                </a>
                                            </f:then>
                                            <f:else>
                                                <a href="{item.link}"
                                                   class="content-planner-link--comments"
                                                   data-table="{item.data.tablename}"
                                                   data-id="{item.data.uid}">
                                                    <f:format.raw>{item.todo}</f:format.raw>
                                                </a>
                                            </f:else>
                                        </f:if>
                                    </f:if>
                                </f:if>
                            </td>
                        </tr>
                    </f:for>
                    </tbody>
                </table>
                <f:if condition="{hasMore}">
                    <div class="content-planner-widget__more-results" role="status">
                        <f:translate key="widgets.contentPlanner.moreResults" extensionName="XimaTypo3ContentPlanner"/>
                    </div>
                </f:if>
            </f:then>
            <f:else>
                <div class="content-planner-widget__empty">
                    <f:render partial="Empty"/>
                </div>
            </f:else>
        </f:if>
    </div>
</div>
</html>
