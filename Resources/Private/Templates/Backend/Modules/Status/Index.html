<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true">

<f:layout name="Module"/>

<f:section name="Content">
    <div class="content-planner-module">
        <h1><f:translate key="LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:header.headline"/></h1>
        <p class="content-planner-module__lead"><f:translate key="LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:header.intro"/></p>

        <f:if condition="{statuses}">
            <f:then>
                <div class="content-planner-module__table-wrap">
                    <table class="table table-hover content-planner-module__table">
                        <thead>
                            <tr>
                                <th scope="col"><f:translate key="LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:header.title"/></th>
                                <th scope="col"><f:translate key="LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:header.default"/></th>
                                <th scope="col"><f:translate key="LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:header.visibility"/></th>
                                <th scope="col"><span class="visually-hidden"><f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.actions"/></span></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{statuses}" as="status">
                                <tr class="{f:if(condition: status.hidden, then: 'text-body-secondary')}">
                                    <td>
                                        <a href="{status.editUrl}" class="text-decoration-none">
                                            <f:render partial="StatusBadge" arguments="{title: status.title, icon: '{status.icon}-{status.color}', color: status.color}"/>
                                        </a>
                                    </td>
                                    <td>
                                        <f:if condition="{status.isDefault}">
                                            <f:then><span class="content-planner-tag"><f:translate key="LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:header.default"/></span></f:then>
                                            <f:else><span class="content-planner-module__muted">–</span></f:else>
                                        </f:if>
                                    </td>
                                    <td>
                                        <f:if condition="{status.hidden}">
                                            <f:then><span class="content-planner-tag content-planner-tag--neutral"><f:translate key="LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:header.hidden"/></span></f:then>
                                            <f:else><span class="content-planner-module__muted"><f:translate key="LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:value.visible"/></span></f:else>
                                        </f:if>
                                    </td>
                                    <td class="text-end">
                                        <div class="btn-group btn-group-sm">
                                            <a href="{status.moveUpUrl}" title="{f:translate(key: 'LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:button.moveUp')}" class="btn btn-default btn-sm{f:if(condition: status.moveUpUrl, else: ' disabled')}" aria-label="{f:translate(key: 'LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:button.moveUp')}">
                                                <core:icon identifier="actions-chevron-up" size="small" alternativeMarkupIdentifier="inline"/>
                                            </a>
                                            <a href="{status.moveDownUrl}" title="{f:translate(key: 'LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:button.moveDown')}" class="btn btn-default btn-sm{f:if(condition: status.moveDownUrl, else: ' disabled')}" aria-label="{f:translate(key: 'LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:button.moveDown')}">
                                                <core:icon identifier="actions-chevron-down" size="small" alternativeMarkupIdentifier="inline"/>
                                            </a>
                                            <a href="{status.editUrl}" class="btn btn-default btn-sm">
                                                <core:icon identifier="actions-open" size="small" alternativeMarkupIdentifier="inline"/>
                                                <span class="content-planner-module__action-label"><f:translate key="LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:button.edit"/></span>
                                            </a>
                                            <a href="#"
                                               class="btn btn-default btn-sm t3js-modal-trigger"
                                               title="{f:translate(key: 'LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:button.delete')}"
                                               aria-label="{f:translate(key: 'LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:button.delete')}"
                                               aria-haspopup="dialog"
                                               data-severity="warning"
                                               data-title="{f:translate(key: 'LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:confirm.delete.title')}"
                                               data-content="{f:translate(key: 'LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:confirm.delete.content', arguments: '{0: status.title}')}"
                                               data-button-ok-text="{f:translate(key: 'LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:button.delete')}"
                                               data-button-close-text="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:cancel')}"
                                               data-uri="{status.deleteUrl}">
                                                <core:icon identifier="actions-delete" size="small" alternativeMarkupIdentifier="inline"/>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <f:be.infobox state="-1" iconName="flag-gray" title="{f:translate(key: 'LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:empty.title')}">
                    <p><f:translate key="LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:empty.body"/></p>
                    <a href="{newStatusUrl}" class="btn btn-default"><f:translate key="LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/Modules/status.xlf:button.new"/></a>
                </f:be.infobox>
            </f:else>
        </f:if>
    </div>
</f:section>

</html>
