<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true">

<f:layout name="Module"/>

<f:section name="Content">
    <div class="content-planner-module">
        <h1><f:translate key="records.header.headline" extensionName="XimaTypo3ContentPlanner"/></h1>
        <p class="content-planner-module__lead"><f:translate key="records.header.description" extensionName="XimaTypo3ContentPlanner"/></p>

        <div class="content-planner-module__presets" role="group" aria-label="{f:translate(key: 'records.presets.groupLabel', extensionName: 'XimaTypo3ContentPlanner')}">
            <f:render partial="RecordPresetTile" arguments="{preset: presets.assignee, icon: 'content-planner-user-circle', labelKey: 'widgets.contentPlanner.kpi.assignee'}"/>
            <f:render partial="RecordPresetTile" arguments="{preset: presets.todo, icon: 'content-planner-checkbox', labelKey: 'filter.openTodos'}"/>
            <f:render partial="RecordPresetTile" arguments="{preset: presets.openComments, icon: 'content-planner-message-circle', labelKey: 'filter.openComments'}"/>
        </div>

        <form method="get" action="{formUrl}" class="content-planner-module__filter">
            <div class="content-planner-module__search">
                <core:icon identifier="content-planner-search" size="small" alternativeMarkupIdentifier="inline"/>
                <input
                    type="search"
                    name="search"
                    id="search"
                    class="form-control"
                    value="{filter.search}"
                    placeholder="{f:translate(key: 'records.filter.search.placeholder', extensionName: 'XimaTypo3ContentPlanner')}"
                    aria-label="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.title.search')}"
                >
            </div>
            <select name="status" class="form-select" aria-label="{f:translate(key: 'widgets.contentPlanner.header.flag', extensionName: 'XimaTypo3ContentPlanner')}">
                <option value=""><f:translate key="filter.allStatuses" extensionName="XimaTypo3ContentPlanner"/></option>
                <f:for each="{statusOptions}" as="status">
                    <option value="{status.uid}" <f:if condition="{status.uid} == {filter.status}">selected="selected"</f:if>>{status.title}</option>
                </f:for>
            </select>
            <select name="assignee" class="form-select" aria-label="{f:translate(key: 'widgets.contentPlanner.header.assignee', extensionName: 'XimaTypo3ContentPlanner')}">
                <option value=""><f:translate key="filter.allAssignees" extensionName="XimaTypo3ContentPlanner"/></option>
                <f:for each="{userOptions}" as="user">
                    <option value="{user.uid}" <f:if condition="{user.uid} == {filter.assignee}">selected="selected"</f:if>>{user.username}</option>
                </f:for>
            </select>
            <f:if condition="{typeOptions}">
                <select name="type" class="form-select" aria-label="{f:translate(key: 'widgets.configurable.setting.recordType.label', extensionName: 'XimaTypo3ContentPlanner')}">
                    <option value=""><f:translate key="filter.allTypes" extensionName="XimaTypo3ContentPlanner"/></option>
                    <f:for each="{typeOptions}" as="type">
                        <option value="{type.value}" <f:if condition="{type.value} == {filter.type}">selected="selected"</f:if>>{type.label}</option>
                    </f:for>
                </select>
            </f:if>
            <div class="form-check content-planner-module__watched">
                <input class="form-check-input" type="checkbox" name="watched" id="watched" value="1" <f:if condition="{filter.watched}">checked="checked"</f:if>>
                <label class="form-check-label" for="watched"><f:translate key="filter.watchedByMe" extensionName="XimaTypo3ContentPlanner"/></label>
            </div>
            <button type="submit" class="btn btn-default"><f:translate key="filter.apply" extensionName="XimaTypo3ContentPlanner"/></button>
            <a href="{formUrl}" class="content-planner-module__reset"><f:translate key="filter.reset" extensionName="XimaTypo3ContentPlanner"/></a>

            <!-- The preset filters live in the chips above, so they have no field here and
                 travel with the form instead, together with the sort. -->
            <f:if condition="{filter.todo}">
                <input type="hidden" name="todo" value="1">
            </f:if>
            <f:if condition="{filter.openComments}">
                <input type="hidden" name="openComments" value="1">
            </f:if>
            <f:if condition="{filter.sort}">
                <input type="hidden" name="sort" value="{filter.sort}">
            </f:if>
            <f:if condition="{filter.dir}">
                <input type="hidden" name="dir" value="{filter.dir}">
            </f:if>
        </form>

        <f:if condition="{items}">
            <f:then>
                <div class="content-planner-module__table-wrap">
                    <table class="table table-hover content-planner-module__table">
                        <thead>
                            <tr>
                                <th scope="col"<f:if condition="{sortLinks.title.ariaSort}"> aria-sort="{sortLinks.title.ariaSort}"</f:if>>
                                    <a href="{sortLinks.title.link}" class="content-planner-module__sort-link">
                                        <f:translate key="records.header.title" extensionName="XimaTypo3ContentPlanner"/>
                                        <f:if condition="{sortLinks.title.activeDirection} == 'asc'">
                                            <f:then><core:icon identifier="content-planner-chevron-up" size="small" alternativeMarkupIdentifier="inline"/></f:then>
                                            <f:else if="{sortLinks.title.activeDirection}"><core:icon identifier="content-planner-chevron-down" size="small" alternativeMarkupIdentifier="inline"/></f:else>
                                        </f:if>
                                    </a>
                                </th>
                                <th scope="col"><f:translate key="widgets.contentPlanner.header.flag" extensionName="XimaTypo3ContentPlanner"/></th>
                                <f:if condition="{typeOptions}">
                                    <th scope="col"><f:translate key="widgets.configurable.setting.recordType.label" extensionName="XimaTypo3ContentPlanner"/></th>
                                </f:if>
                                <th scope="col"><f:translate key="widgets.contentPlanner.header.assignee" extensionName="XimaTypo3ContentPlanner"/></th>
                                <th scope="col"<f:if condition="{sortLinks.changed.ariaSort}"> aria-sort="{sortLinks.changed.ariaSort}"</f:if>>
                                    <a href="{sortLinks.changed.link}" class="content-planner-module__sort-link">
                                        <f:translate key="records.header.changed" extensionName="XimaTypo3ContentPlanner"/>
                                        <f:if condition="{sortLinks.changed.activeDirection} == 'asc'">
                                            <f:then><core:icon identifier="content-planner-chevron-up" size="small" alternativeMarkupIdentifier="inline"/></f:then>
                                            <f:else if="{sortLinks.changed.activeDirection}"><core:icon identifier="content-planner-chevron-down" size="small" alternativeMarkupIdentifier="inline"/></f:else>
                                        </f:if>
                                    </a>
                                </th>
                                <th scope="col" class="text-end"><f:translate key="records.header.activity" extensionName="XimaTypo3ContentPlanner"/></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{items}" as="item">
                                <tr>
                                    <td class="content-planner-module__record">
                                        <div class="content-planner-module__title-line">
                                            <a href="{item.link}"><strong>{item.title}</strong></a>
                                            <f:if condition="{item.assignedToCurrentUser}">
                                                <span class="content-planner-module__tag"><f:translate key="records.tag.assignedToYou" extensionName="XimaTypo3ContentPlanner"/></span>
                                            </f:if>
                                        </div>
                                        <f:if condition="{item.pagePath}">
                                            <div class="content-planner-module__path" title="{item.pagePath}">{item.pagePath}</div>
                                        </f:if>
                                    </td>
                                    <td>
                                        <f:if condition="{item.statusColor}">
                                            <f:then>
                                                <f:if condition="{item.statusFilterLink}">
                                                    <f:then>
                                                        <a href="{item.statusFilterLink}" class="content-planner-module__cell-link">
                                                            <f:render partial="StatusBadge" arguments="{title: item.status, icon: item.statusIconIdentifier, color: item.statusColor}"/>
                                                        </a>
                                                    </f:then>
                                                    <f:else>
                                                        <f:render partial="StatusBadge" arguments="{title: item.status, icon: item.statusIconIdentifier, color: item.statusColor}"/>
                                                    </f:else>
                                                </f:if>
                                            </f:then>
                                            <f:else>
                                                <span class="content-planner-module__muted"><f:translate key="records.status.none" extensionName="XimaTypo3ContentPlanner"/></span>
                                            </f:else>
                                        </f:if>
                                    </td>
                                    <f:if condition="{typeOptions}">
                                        <td>
                                            <a href="{item.typeFilterLink}" class="content-planner-module__cell-link">
                                                <f:format.raw>{item.recordIcon}</f:format.raw>
                                                {item.recordTypeLabel}
                                            </a>
                                        </td>
                                    </f:if>
                                    <td>
                                        <f:if condition="{item.assignee}">
                                            <f:then>
                                                <a href="{item.assigneeFilterLink}" class="content-planner-module__cell-link" title="{item.assigneeName}">
                                                    <f:format.raw>{item.assigneeAvatar}</f:format.raw>
                                                    {item.assigneeShortName}
                                                </a>
                                            </f:then>
                                            <f:else>
                                                <span class="content-planner-module__muted content-planner-module__unassigned">
                                                    <span class="content-planner-module__unassigned-mark" aria-hidden="true"></span>
                                                    <f:translate key="header.unassigned" extensionName="XimaTypo3ContentPlanner"/>
                                                </span>
                                            </f:else>
                                        </f:if>
                                    </td>
                                    <td><span class="content-planner-module__muted" title="{item.updatedRaw}">{item.updated}</span></td>
                                    <td class="content-planner-module__activity">
                                        <f:if condition="{item.commentsName}">
                                            <span>{item.commentsName}</span>
                                        </f:if>
                                        <f:if condition="{item.todoName}">
                                            <span>{item.todoName}</span>
                                        </f:if>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>

                <nav class="content-planner-module__pagination" aria-label="{f:translate(key: 'records.pagination.label', extensionName: 'XimaTypo3ContentPlanner')}">
                    <span class="content-planner-module__muted">
                        <f:translate key="records.pagination.range" extensionName="XimaTypo3ContentPlanner" arguments="{0: rangeStart, 1: rangeEnd}"/>
                    </span>
                    <div class="btn-group">
                        <f:if condition="{previousPageUrl}">
                            <f:then><a href="{previousPageUrl}" class="btn btn-default"><f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:previous"/></a></f:then>
                            <f:else><span class="btn btn-default disabled" aria-disabled="true"><f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:previous"/></span></f:else>
                        </f:if>
                        <f:if condition="{nextPageUrl}">
                            <f:then><a href="{nextPageUrl}" class="btn btn-default"><f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:next"/></a></f:then>
                            <f:else><span class="btn btn-default disabled" aria-disabled="true"><f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:next"/></span></f:else>
                        </f:if>
                    </div>
                </nav>
            </f:then>
            <f:else>
                <f:render partial="Empty"/>
            </f:else>
        </f:if>
    </div>
</f:section>

</html>
