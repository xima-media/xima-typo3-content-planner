<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true">

<f:layout name="Module"/>

<f:section name="Content">
    <div class="content-planner-module">
        <h1><f:translate key="records.header.headline" extensionName="XimaTypo3ContentPlanner" default="Records (with Content Planner status)"/></h1>

        <form method="get" action="{formUrl}" class="content-planner-module__filter mb-3">
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-3">
                <div class="row g-2 align-items-end">
                    <div class="col-auto">
                        <label for="search" class="form-label"><f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.title.search"/></label>
                        <input type="text" name="search" id="search" class="form-control" value="{filter.search}">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">
                            <core:icon identifier="content-planner-search" size="small" alternativeMarkupIdentifier="inline"/>
                            <f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.title.search"/>
                        </button>
                        <a href="{formUrl}" class="btn btn-default">
                            <core:icon identifier="content-planner-x" size="small" alternativeMarkupIdentifier="inline"/>
                            <f:translate key="LLL:EXT:xima_typo3_content_planner/Resources/Private/Language/locallang.xlf:filter.reset" default="Reset"/>
                        </a>
                        <button
                            type="button"
                            class="btn btn-default content-planner-module__filter-toggle"
                            data-bs-toggle="collapse"
                            data-bs-target="#recordFilterAdvanced"
                            aria-expanded="{f:if(condition: '{advancedFilterCount} > 0', then: 'true', else: 'false')}"
                            aria-controls="recordFilterAdvanced"
                        >
                            <core:icon identifier="content-planner-filter" size="small" alternativeMarkupIdentifier="inline"/>
                            <f:translate key="filter.moreFilters" extensionName="XimaTypo3ContentPlanner" default="More filters"/>
                            <f:if condition="{advancedFilterCount} > 0">
                                <span class="badge badge-primary">{advancedFilterCount}</span>
                            </f:if>
                        </button>
                    </div>
                </div>

                <div class="content-planner-module__presets">
                    <f:render partial="RecordPresetTile" arguments="{preset: presets.assignee, icon: 'content-planner-user-circle', labelKey: 'records.presets.assignee'}"/>
                    <f:render partial="RecordPresetTile" arguments="{preset: presets.todo, icon: 'content-planner-checkbox', labelKey: 'records.presets.todo'}"/>
                    <f:render partial="RecordPresetTile" arguments="{preset: presets.openComments, icon: 'content-planner-message-circle', labelKey: 'records.presets.openComments'}"/>
                </div>
            </div>

            <f:if condition="{activeFilterChips}">
                <ul class="content-planner-module__chips">
                    <f:for each="{activeFilterChips}" as="chip">
                        <li>
                            <a href="{chip.removeUrl}" class="content-planner-module__chip">
                                <span>{chip.label}</span>
                                <core:icon identifier="content-planner-x" size="small" alternativeMarkupIdentifier="inline"/>
                                <span class="visually-hidden"><f:translate key="records.chips.remove" extensionName="XimaTypo3ContentPlanner" default="Remove filter"/></span>
                            </a>
                        </li>
                    </f:for>
                </ul>
            </f:if>

            <div class="collapse{f:if(condition: '{advancedFilterCount} > 0', then: ' show')}" id="recordFilterAdvanced">
                <div class="row g-2 align-items-end mt-1">
                    <div class="col-auto">
                        <label for="status" class="form-label"><f:translate key="widgets.contentPlanner.header.flag" extensionName="XimaTypo3ContentPlanner" default="Status"/></label>
                        <select name="status" id="status" class="form-select">
                            <option value="">-</option>
                            <f:for each="{statusOptions}" as="status">
                                <option value="{status.uid}" <f:if condition="{status.uid} == {filter.status}">selected="selected"</f:if>>{status.title}</option>
                            </f:for>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label for="assignee" class="form-label"><f:translate key="widgets.contentPlanner.header.assignee" extensionName="XimaTypo3ContentPlanner" default="Assignee"/></label>
                        <select name="assignee" id="assignee" class="form-select">
                            <option value="">-</option>
                            <f:for each="{userOptions}" as="user">
                                <option value="{user.uid}" <f:if condition="{user.uid} == {filter.assignee}">selected="selected"</f:if>>{user.username}</option>
                            </f:for>
                        </select>
                    </div>
                    <f:if condition="{typeOptions}">
                        <div class="col-auto">
                            <label for="type" class="form-label"><f:translate key="widgets.configurable.setting.recordType.label" extensionName="XimaTypo3ContentPlanner" default="Record Type"/></label>
                            <select name="type" id="type" class="form-select">
                                <option value="">-</option>
                                <f:for each="{typeOptions}" as="type">
                                    <option value="{type.value}" <f:if condition="{type.value} == {filter.type}">selected="selected"</f:if>>{type.label}</option>
                                </f:for>
                            </select>
                        </div>
                    </f:if>
                    <div class="col-auto form-check">
                        <input class="form-check-input" type="checkbox" name="watched" id="watched" value="1" <f:if condition="{filter.watched}">checked="checked"</f:if>>
                        <label class="form-check-label" for="watched"><f:translate key="filter.watchedByMe" extensionName="XimaTypo3ContentPlanner" default="Watched by me"/></label>
                    </div>
                </div>
            </div>

            <!-- Preset filters applied via the tiles above still need to travel with the form
                 on submit (e.g. adjusting search while "Open ToDos" is active), but have no
                 visible field of their own once "aufräumen" (CP-33 follow-up) moved them out of
                 the advanced panel. -->
            <f:if condition="{filter.todo}">
                <input type="hidden" name="todo" value="1">
            </f:if>
            <f:if condition="{filter.openComments}">
                <input type="hidden" name="openComments" value="1">
            </f:if>
        </form>

        <f:if condition="{items}">
            <f:then>
                <div class="table-fit">
                    <table class="table table-striped table-hover content-planner-module__table{f:if(condition: typeOptions, then: ' content-planner-module__table--with-type')}">
                        <thead>
                            <tr>
                                <th><f:translate key="records.header.title" extensionName="XimaTypo3ContentPlanner" default="Title"/></th>
                                <th><f:translate key="widgets.contentPlanner.header.flag" extensionName="XimaTypo3ContentPlanner" default="Status"/></th>
                                <f:if condition="{typeOptions}">
                                    <th><f:translate key="widgets.configurable.setting.recordType.label" extensionName="XimaTypo3ContentPlanner" default="Record Type"/></th>
                                </f:if>
                                <th><f:translate key="widgets.contentPlanner.header.site" extensionName="XimaTypo3ContentPlanner"/></th>
                                <th><f:translate key="widgets.contentPlanner.header.tstamp" extensionName="XimaTypo3ContentPlanner"/></th>
                                <th><f:translate key="widgets.contentPlanner.header.assignee" extensionName="XimaTypo3ContentPlanner"/></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{items}" as="item">
                                <tr class="{f:if(condition: item.assignedToCurrentUser, then: 'table-info')}">
                                    <td>
                                        <a href="{item.link}"><strong>{item.title}</strong></a>
                                    </td>
                                    <td>
                                        <f:format.raw>{item.statusIcon}</f:format.raw>
                                        {item.status}
                                    </td>
                                    <f:if condition="{typeOptions}">
                                        <td>
                                            <f:format.raw>{item.recordIcon}</f:format.raw>
                                            {item.recordTypeLabel}
                                        </td>
                                    </f:if>
                                    <td class="content-planner-module__site" title="{item.site}">{item.site}</td>
                                    <td><small title="{item.updatedRaw}">{item.updated}</small></td>
                                    <td>
                                        <f:if condition="{item.assignee}">
                                            <span title="{item.assigneeName}">
                                                <f:format.raw>{item.assigneeAvatar}</f:format.raw>
                                                {item.assigneeShortName}
                                            </span>
                                        </f:if>
                                    </td>
                                    <td>
                                        <f:if condition="{item.comments}">
                                            <span class="content-planner-module__action-group">
                                                <f:format.raw>{item.comments}</f:format.raw>
                                            </span>
                                        </f:if>
                                        <f:if condition="{item.todo}">
                                            <span class="content-planner-module__action-group">
                                                <f:format.raw>{item.todo}</f:format.raw>
                                            </span>
                                        </f:if>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>

                <nav class="content-planner-module__pagination d-flex justify-content-between align-items-center mt-3">
                    <span class="text-body-secondary">
                        <f:translate key="records.pagination.range" extensionName="XimaTypo3ContentPlanner" arguments="{0: rangeStart, 1: rangeEnd}"/>
                    </span>
                    <div>
                        <f:if condition="{previousPageUrl}">
                            <a href="{previousPageUrl}" class="btn btn-default">&larr; <f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:previous"/></a>
                        </f:if>
                        <f:if condition="{nextPageUrl}">
                            <a href="{nextPageUrl}" class="btn btn-default"><f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:next"/> &rarr;</a>
                        </f:if>
                    </div>
                </nav>
            </f:then>
            <f:else>
                <f:render partial="Empty"/>
            </f:else>
        </f:if>
    </div>
</f:section>

</html>
